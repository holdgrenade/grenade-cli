# Ships the CLI on every push to main. A push that did not bump `version` in package.json gets the next patch from the
# `bump` job, committed back to main; a push that bumped it ships its own number.
#
# Homebrew is the release: the tag, the GitHub release with the tarball, and the formula in the tap, whose sha256 is
# taken from the tarball downloaded back from the release. npm comes last and may fail without failing the release
# (the account can be suspended; trusted publishing may not be set up).
#
# One-time setup, outside this file:
#   - Two repository secrets, each a fine-grained personal access token that reaches one repo:
#     GH_GRENADE_PROTOCOL_TOKEN  Contents: read on holdgrenade/grenade-protocol (private; the CLI builds it)
#     GH_HOMEBREW_TAP_TOKEN      Contents: write on holdgrenade/homebrew-tap (the formula is pushed there)
#   - For npm, when it is usable: npmjs.com → @holdgrenade/cli → Settings → Trusted publisher: GitHub Actions,
#     holdgrenade/grenade-cli, release.yml. Then `npm publish` below needs no token and no second factor.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # the tag and the GitHub release
  id-token: write # npm trusted publishing

# Two pushes in a row release one after the other, never at the same time.
concurrency: release

jobs:
  # Every push releases. A push whose version is tagged already did not bump it, so this job takes the next patch and
  # commits it back to main ("1.0.69"); a push that bumped the version itself (a minor, say) keeps its number. A tag,
  # not the tap, says what is released: raw.githubusercontent.com may serve a tap that is minutes old. The jobs below
  # build the commit this job hands on. Its push uses GITHUB_TOKEN, which starts no workflow, so it never loops.
  bump:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Check out main as it is now, with its tags
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The release-notes writer (Claude; without it, the commit subjects)
        run: curl -fsSL https://raw.githubusercontent.com/holdgrenade/.github/main/release-notes/release-notes.mjs -o "$RUNNER_TEMP/release-notes.mjs" || echo "No release-notes writer, so the notes are the commit subjects"

      # The version to release always has its CHANGELOG.md section: a section written by hand is kept; else
      # Claude's notes on the commits since the previous tag, or their subjects without a key (no merges, none of
      # this job's own commits).
      - name: The next patch and its CHANGELOG section, unless this version is new
        id: bump
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RELEASE_NOTES_READER: people who run the grenade CLI and its daemon on their Mac or Linux computer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version() { node -p "require('./package.json').version"; }
          tagged() { git ls-remote --exit-code --tags origin "refs/tags/v$1" >/dev/null; }
          has_section() { grep -q "^## $1 " CHANGELOG.md; }
          lines="$RUNNER_TEMP/lines"
          # Three tries: a push that lands while this runs moves main, and the bump goes on top of it.
          for attempt in 1 2 3; do
            message=""
            prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)
            if tagged "$(version)"; then
              npm version patch --no-git-tag-version >/dev/null
              message="$(version)"
            fi
            if ! has_section "$(version)"; then
              node "$RUNNER_TEMP/release-notes.mjs" "$prev" > "$lines" || git log ${prev:+"$prev..HEAD"} --no-merges --format='%an%x09%s' | awk -F'\t' '$1 != "github-actions[bot]" { print "- " $2 }' > "$lines"
              [ -s "$lines" ] || echo "- No change of its own." > "$lines"
              VERSION=$(version) LINES="$lines" node -e '
                const fs = require("fs");
                const day = new Date().toISOString().slice(0, 10);
                const text = fs.readFileSync("CHANGELOG.md", "utf8");
                const section = `## ${process.env.VERSION} (${day})\n\n${fs.readFileSync(process.env.LINES, "utf8").trim()}\n\n`;
                const at = text.indexOf("\n## ");
                fs.writeFileSync("CHANGELOG.md", at < 0 ? text.trimEnd() + "\n\n" + section : text.slice(0, at + 1) + section + text.slice(at + 1));'
              message="${message:-$(version): CHANGELOG}"
            fi
            [ -n "$message" ] || break
            git commit --quiet --all -m "$message"
            if git push --quiet origin HEAD:main; then break; fi
            git fetch --quiet --tags origin main && git reset --quiet --hard origin/main
            if [ "$attempt" = 3 ]; then echo "main kept moving; push again to release" && exit 1; fi
          done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(version)" >> "$GITHUB_OUTPUT"
          echo "Releasing $(version) from $(git rev-parse --short HEAD)"

  # grenaded runs on Linux too: the same tests there, then the daemon against a real tmux (scripts/smoke.mjs), in an
  # Arch Linux container, which is what Omarchy is. A release waits for it.
  linux:
    needs: bump
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Node, tmux and git
        run: pacman -Syu --noconfirm --needed --disable-sandbox nodejs npm tmux git && node --version && tmux -V

      - name: Check out grenade-cli
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}
          path: grenade-cli

      - name: Check out grenade-protocol beside it
        uses: actions/checkout@v4
        with:
          repository: holdgrenade/grenade-protocol
          token: ${{ secrets.GH_GRENADE_PROTOCOL_TOKEN }}
          path: grenade-protocol

      - name: Install the protocol
        working-directory: grenade-protocol
        run: npm ci

      - name: Install and test the CLI
        working-directory: grenade-cli
        run: npm ci && npm test

      - name: The daemon against a real tmux
        working-directory: grenade-cli
        shell: bash
        run: |
          npm run build
          export TMUX_TMPDIR=$(mktemp -d /tmp/gr.XXXX) GRENADE_HOME=$(mktemp -d)
          node dist/cli.js --control-port 7790 daemon --port 7799 --no-advertise --terminal none --no-relay &
          sleep 3
          node scripts/smoke.mjs --port 7799 --control-port 7790
          kill %1

  release:
    needs: [bump, linux]
    runs-on: macos-latest
    steps:
      - name: Check out grenade-cli
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}
          path: grenade-cli

      - name: Check out grenade-protocol beside it
        uses: actions/checkout@v4
        with:
          repository: holdgrenade/grenade-protocol
          token: ${{ secrets.GH_GRENADE_PROTOCOL_TOKEN }}
          path: grenade-protocol

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: npm 11.5 or newer, for trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Install and test the protocol
        working-directory: grenade-protocol
        run: npm ci && npm test

      - name: Install and test the CLI
        working-directory: grenade-cli
        run: npm ci && npm test

      - name: Is this version in the tap already?
        id: version
        working-directory: grenade-cli
        run: |
          version=$(node -p "require('./package.json').version")
          if curl -fsSL https://raw.githubusercontent.com/holdgrenade/homebrew-tap/main/Formula/grenade.rb | grep -q "/v$version/"; then
            released=true
          else
            released=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "released=$released" >> "$GITHUB_OUTPUT"
          echo "grenade $version in the tap: $released"

      - name: Build the tarball and the formula
        if: steps.version.outputs.released == 'false'
        working-directory: grenade-cli
        run: npm run release

      # The steps below are safe to run again: each skips what an earlier, interrupted run already did.
      - name: Tag and GitHub release, with the tarball as its asset
        if: steps.version.outputs.released == 'false'
        working-directory: grenade-cli
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git fetch --tags --quiet
          if ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            awk -v v="$VERSION" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
            printf '\nInstall: `brew install holdgrenade/tap/grenade` or `npm install -g @holdgrenade/cli`, then `grenade setup`.\n' >> notes.md
            gh release create "v$VERSION" "release/holdgrenade-cli-$VERSION.tgz" \
              --title "Grenade $VERSION" \
              --notes-file notes.md
          fi

      - name: The formula, with the sha256 of the tarball on the release
        if: steps.version.outputs.released == 'false'
        working-directory: grenade-cli
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          rm -rf released && mkdir released
          gh release download "v$VERSION" --pattern "holdgrenade-cli-$VERSION.tgz" --dir released
          node scripts/formula-from-tarball.mjs "released/holdgrenade-cli-$VERSION.tgz"

      - name: Copy the formula to the tap
        if: steps.version.outputs.released == 'false'
        env:
          GH_HOMEBREW_TAP_TOKEN: ${{ secrets.GH_HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git clone --quiet "https://x-access-token:$GH_HOMEBREW_TAP_TOKEN@github.com/holdgrenade/homebrew-tap.git" homebrew-tap
          cp grenade-cli/packaging/homebrew/grenade.rb homebrew-tap/Formula/grenade.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/grenade.rb
          if git diff --cached --quiet; then
            echo "The tap already has grenade $VERSION."
          else
            git commit --quiet -m "grenade $VERSION"
            git push --quiet origin main
          fi

      # Best effort: the same tarball on npm. A failure here leaves the Homebrew release standing.
      # It does not wait for the tap: a version the tap has but npm lacks is published from its GitHub release, so a
      # rerun (or a manual dispatch) catches npm up after it was unusable.
      - name: Publish to npm
        continue-on-error: true
        working-directory: grenade-cli
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "@holdgrenade/cli@$VERSION" version >/dev/null 2>&1; then
            echo "@holdgrenade/cli@$VERSION is on npm already."
          else
            if [ ! -f "released/holdgrenade-cli-$VERSION.tgz" ]; then
              mkdir -p released
              gh release download "v$VERSION" --pattern "holdgrenade-cli-$VERSION.tgz" --dir released
            fi
            npm publish "./released/holdgrenade-cli-$VERSION.tgz"   # `./` matters: npm reads a bare path as a GitHub repo
          fi
